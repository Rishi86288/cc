name = "vite-react-template"
main = "src/worker.ts"
compatibility_date = "2024-01-01"

# 1. D1 Database (Run: npx wrangler d1 create cipet-db)
[[d1_databases]]
binding = "DB"
database_name = "cipet-db"
database_id = "160e607a-81f8-4f53-ba6c-733a204c3834"

# 2. R2 Storage (Run: npx wrangler r2 bucket create cipet-files)
[[r2_buckets]]
binding = "FILES_BUCKET"
bucket_name = "cipet-files"

# 3. KV for OTPs (Run: npx wrangler kv:namespace create OTP_KV)
[[kv_namespaces]]
binding = "OTP_KV"
id = "970999ee5b6a485cbd03036c5ce325cb"

# Note: Environment Variables like SUPER_ADMIN_EMAIL and ADMIN_SECRET_KEY 
# should be set securely via the Cloudflare Dashboard or using:
# npx wrangler secret put KEY_NAME
